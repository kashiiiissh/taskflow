# ===============================
# SERVER CONFIG
# ===============================
server.port=8080

# ===============================
# DATABASE CONFIG (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/taskflow_db
spring.datasource.username=postgres
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# LOGGING (OPTIONAL)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# JWT CONFIG (CUSTOM)
# ===============================
app.jwt.secret=yourSuperSecretKey123456789
app.jwt.expiration=900000
app.jwt.refresh-expiration=604800000

# ===============================
# CORS (OPTIONAL - if not using config class)
# ===============================
# handled via CorsConfig class

# ===============================
# SPRING SECURITY (OPTIONAL)
# ===============================
spring.security.user.name=admin
spring.security.user.password=admin

# ===============================
# FILE UPLOAD (OPTIONAL FUTURE USE)
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB